<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apps by Jinhoe</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #1d1d1f;
      --muted: #86868b;
      --line: #e5e5ea;
      --link: #0071e3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000;
        --fg: #f5f5f7;
        --muted: #86868b;
        --line: #2c2c2e;
        --link: #2997ff;
      }
    }

    body {
      margin: 0;
      padding: 96px 24px;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 40px;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li {
      padding: 20px 0;
      border-top: 1px solid var(--line);
    }

    li:last-child {
      border-bottom: 1px solid var(--line);
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .name {
      font-size: 20px;
      font-weight: 600;
      color: var(--fg);
    }

    .links {
      margin-top: 4px;
      font-size: 15px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Apps</h1>
    <ul>
      <li>
        <a class="name" href="/zhebus/">ZheBus</a>
        <div class="links">
          <a href="/zhebus/support/">Support</a> · <a href="/zhebus/privacy/">Privacy</a>
        </div>
      </li>
      <li>
        <a class="name" href="/kongqi/">KongQi</a>
        <div class="links">
          <a href="/kongqi/support/">Support</a> · <a href="/kongqi/privacy/">Privacy</a>
        </div>
      </li>
    </ul>
  </main>
</body>
</html>
