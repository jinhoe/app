<!doctype html>
<html lang="en"$html_attrs>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
// Apply saved appearance before first paint (light | dark | auto).
// Shared with jinhoe.com via a "theme" cookie on .jinhoe.com; localStorage is the fallback.
(function () {
  var t = (document.cookie.match(/(?:^|; )theme=(light|dark|auto)(?:;|$$)/) || [])[1];
  if (!t) try { t = localStorage.getItem("theme"); } catch (e) {}
  if (["light", "dark", "auto"].indexOf(t) < 0) t = "auto";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<title>$title</title>
<meta name="description" content="$description">
<link rel="canonical" href="$canonical">
<meta property="og:type" content="website">
<meta property="og:title" content="$title">
<meta property="og:description" content="$description">
<meta property="og:url" content="$canonical">
$head_extra
<meta name="theme-color" content="#EBEAE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">

</head>
